[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tirzah"
version = "1.2.0"
description = "Local graph-based memory and retrieval layer for LLM interactions."
readme = "README.md"
requires-python = ">=3.11"
keywords = [
  "llm",
  "memory",
  "retrieval",
  "graph",
  "mongodb",
  "ollama",
  "local-first",
]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Environment :: Console",
  "Framework :: FastAPI",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Database",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Software Development :: Libraries :: Application Frameworks",
]
dependencies = [
  "fastapi>=0.115",
  "pydantic>=2.7",
  "pymongo>=4.7",
  "pyyaml>=6.0",
  "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = [
  "build>=1.2",
  "httpx>=0.27",
  "pytest>=8.0",
]
profiles = [
  "fastembed>=0.7",
]
hoglah = [
  "hoglah>=0.3.0",
]
hoglah-kafka = [
  "hoglah>=0.3.0",
  "confluent-kafka>=2.3",
]
hoglah-rabbitmq = [
  "hoglah>=0.3.0",
  "pika>=1.3",
]
hoglah-redis = [
  "hoglah>=0.3.0",
  "redis>=5.0",
]

[project.scripts]
tirzah = "tirzah.cli:main"
mnemosyne = "tirzah.cli:main"
tirzah-profile-helper = "tirzah.profile_helper:main_cli"

[project.urls]
Homepage = "https://github.com/gellsmore-svg/tirzah"
Repository = "https://github.com/gellsmore-svg/tirzah"
Issues = "https://github.com/gellsmore-svg/tirzah/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"tirzah.web" = ["static/*.html", "static/*.js", "static/*.css"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
  "real_mongo: tests that require a reachable MongoDB service and exercise real collections/indexes",
]
