[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tirzah"
version = "1.10.0"
description = "Local graph-based memory and retrieval layer for LLM interactions."
readme = "README.md"
requires-python = ">=3.11"
keywords = [
  "llm",
  "memory",
  "retrieval",
  "graph",
  "mongodb",
  "ollama",
  "local-first",
]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Environment :: Console",
  "Framework :: FastAPI",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Database",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Software Development :: Libraries :: Application Frameworks",
]
dependencies = [
  "pydantic>=2.7",
  "pymongo>=4.7",
  "pyyaml>=6.0",
  "galeed>=0.1",  # the cross-project trace/log spine (extracted from tirzah.trace)
  "cairn-lang>=0.3",  # process-grammar conformance (import name: cairn) the recursive planner validates against
  "keturah>=0.1",  # uniform manifest of LLM-consumable interfaces (served at /api/capabilities)
]

[project.optional-dependencies]
# Web UI / HTTP API (`tirzah serve`). Optional so library/CLI installs stay lean;
# the core never imports fastapi/uvicorn unless serving. A precursor to splitting
# the UI out once the HTTP API is a stable, versioned contract.
web = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
]
dev = [
  "tirzah[web]",   # the web TestClient tests need fastapi
  "build>=1.2",
  "httpx>=0.27",
  "pytest>=8.0",
]
profiles = [
  "fastembed>=0.7",
]
# Semantic precision via Mahalath (the Tirzah->Mahalath seam, tirzah/semantic.py).
# Mahalath must be importable in Tirzah's environment for the package-level
# resolver: co-install it (shared venv) or `pipx inject tirzah mahalath`. Not on
# PyPI yet — install from the local repo / git until published.
mahalath = [
  "mahalath>=1.1.0",
]
# Specialist coherence/research via Milcah (the Tirzah->Milcah seam,
# tirzah/coherence.py). Off by default and fail-soft if absent; install this
# extra when `runtime.milcah_enabled` is true. Milcah's default specialist
# runtime submits role calls through Hoglah, so include Milcah's Hoglah extra.
milcah = [
  "milcah[hoglah]>=0.2.0",
]
hoglah = [
  "hoglah>=0.8.0",
]
hoglah-kafka = [
  "hoglah>=0.8.0",
  "confluent-kafka>=2.3",
]
hoglah-rabbitmq = [
  "hoglah>=0.8.0",
  "pika>=1.3",
]
hoglah-redis = [
  "hoglah>=0.8.0",
  "redis>=5.0",
]

[project.scripts]
tirzah = "tirzah.cli:main"
mnemosyne = "tirzah.cli:main"
tirzah-profile-helper = "tirzah.profile_helper:main_cli"

[project.urls]
Homepage = "https://github.com/gellsmore-svg/tirzah"
Repository = "https://github.com/gellsmore-svg/tirzah"
Issues = "https://github.com/gellsmore-svg/tirzah/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"tirzah.web" = ["static/*.html", "static/*.js", "static/*.css"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
  "real_mongo: tests that require a reachable MongoDB service and exercise real collections/indexes",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
# E402/E731/E741 are established style in this codebase (late imports for
# optional deps, seam lambdas, math-ish single letters); churn > value.
ignore = ["E402", "E731", "E741"]
