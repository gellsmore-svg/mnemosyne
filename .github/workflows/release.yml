name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Build Python artifacts
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Validate Python artifacts install
        run: |
          python -m venv /tmp/tirzah-release-smoke
          /tmp/tirzah-release-smoke/bin/pip install --upgrade pip
          /tmp/tirzah-release-smoke/bin/pip install dist/*.whl
          /tmp/tirzah-release-smoke/bin/tirzah --help
          /tmp/tirzah-release-smoke/bin/tirzah-profile-helper --help
          /tmp/tirzah-release-smoke/bin/python - <<'PY'
          from importlib.resources import files

          assert files("tirzah.web.static").joinpath("index.html").is_file()
          PY

      - name: Validate Docker image builds
        run: |
          docker build -t tirzah:${GITHUB_REF_NAME} .

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*
