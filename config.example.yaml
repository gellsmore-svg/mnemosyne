mongo:
  uri: mongodb://localhost:27017
  # Kept on the existing development database during the product rename so local corpora remain visible.
  database: mnemosyne_dev

paths:
  ingest: data/ingest
  archive: data/archive
  dead_letter: data/dead_letter
  staging: data/staging

runtime:
  model_adapter: mock
  answer_adapter: ollama_cli
  ingestion_adapter: mock
  embedding_adapter: mock
  # HTTP-backed embedding adapters are not compliant for ingestion/retrieval memory operations.
  allow_http_ingestion_adapters: false
  embedding_model: nomic-embed-text:latest
  embedding_dimensions: 16
  # Optional non-HTTP local profile generator. The command receives JSON on stdin:
  # {"model": "...", "text": "..."} and should return {"vector": [...]} or {"embedding": [...]}.
  profile_command: []
  # Use "worker" when the command reads one JSON request per line and returns one JSON response per line.
  profile_command_mode: single
  profile_backfill_recommended_batch_limit: 25
  profile_backfill_web_max_batches: 10
  memory_agent_adapter:
  retrieval_mode: direct
  # Versioned Cairn plan wrapper below the front end. The planner creates an
  # initial process, then revises it from new retrieval/execution information.
  recursive_planning_enabled: true
  planning_adapter:
  planning_model:
  planning_max_revisions: 3
  planning_max_steps: 12
  # Opt-in transient web evidence through a SearxNG JSON endpoint. For a local
  # SearxNG instance, web_allow_private_search_endpoint must be true; fetched result URLs still
  # receive scheme, redirect, size, and content-type checks.
  web_research_enabled: false
  web_search_base_url: http://localhost:8080
  web_timeout_seconds: 12
  web_max_results: 5
  web_max_pages: 2
  web_max_content_bytes: 500000
  web_max_content_chars: 8000
  web_allow_private_search_endpoint: false
  # Optional Milcah specialist seam. Install with `pip install "tirzah[milcah]"`
  # (or co-install the local Milcah repo), then enable this so recursive planning
  # may dispatch coherence/counter-framework checks to Milcah. Fail-soft if absent.
  milcah_enabled: false
  milcah_model: ""
  ollama_model: gemma3:1b
  memory_agent_model:
  ollama_format:
  memory_agent_ollama_format: json
  ollama_think: false
  ollama_hide_thinking: true
  ollama_base_url: http://localhost:11434
  # Resolved from PATH by default (portable). Override for a non-PATH install,
  # e.g. a WSL-mounted Windows binary, or set the OLLAMA_EXECUTABLE env var:
  #   ollama_executable: /mnt/c/Users/<you>/AppData/Local/Programs/Ollama/ollama.exe
  ollama_executable: ollama
  ollama_timeout_seconds: 180
  # Optional Hoglah queue integration for answers AND embeddings. Install with
  # `pip install "tirzah[hoglah]"` and set answer_adapter / embedding_adapter to
  # "hoglah". Decoupled topology: Tirzah is a pure submitter into the shared
  # queue; run a SEPARATE worker daemon (pointed at the same db_path/output_dir),
  # e.g.:
  #   HOGLAH_OUTPUT_DIR=data/hoglah/outbox \
  #     hoglah run --real --db data/hoglah/jobs.sqlite3 \
  #     --ollama-host http://<host>:11434 -c 1
  # The "hoglah" embedding adapter is permitted for memory ops without
  # allow_http_ingestion_adapters (Tirzah does only local IPC; the daemon makes
  # the Ollama HTTP call).
  hoglah_db_path: data/hoglah/jobs.sqlite3
  hoglah_ollama_host: http://localhost:11434
  hoglah_use_real: true          # back-compat; unused by the submitter (daemon owns real exec)
  hoglah_wait_timeout_seconds:
  hoglah_output_dir: data/hoglah/outbox
  hoglah_delivery: poll          # "poll" the output folder, or "callback"
  hoglah_callback_host: 127.0.0.1
  hoglah_callback_port: 0         # 0 = OS-assigned ephemeral port

queue:
  max_attempts: 3

retrieval:
  context_char_budget: 4000
  prompt_token_budget: 2000
  reserved_response_tokens: 500
  memory_agent_max_iterations: 4
