services:
  mongo:
    image: mongo:8.0
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    ports:
      # Loopback-only on the HOST: the API and Mongo are unauthenticated
      # (SECURITY.md) — front with an authenticating proxy to expose beyond
      # this machine.
      - "127.0.0.1:27017:27017"

  app:
    build: .
    restart: unless-stopped
    depends_on:
      - mongo
    ports:
      - "127.0.0.1:8765:8765"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - .:/app
      - tirzah-data:/app/data
    command: ["tirzah", "serve", "--host", "0.0.0.0", "--port", "8765"]

volumes:
  mongo-data:
  tirzah-data:
